[project]
name = "lakshsolanki-backend"
version = "0.1.0"
description = "FastAPI backend for LakshSolanki"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "python-dotenv==1.1.0",
    "pymongo==4.12.1",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.10.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
