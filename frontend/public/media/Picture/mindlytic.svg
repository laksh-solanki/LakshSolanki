<svg width="300" height="300" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mindlytic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="50%" stop-color="#AA5E7A" />
      <stop offset="100%" stop-color="#D49A9A" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C0E44" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    .m-body {
      animation: breathe 3.5s ease-in-out infinite;
      transform-origin: center;
    }
    .flare {
      animation: breathe 2s ease-in-out infinite alternate;
      transform-origin: center;
    }
  </style>

  <!-- Clean card base -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" stroke-width="1.5" />

  <!-- Neural M-curve -->
  <path class="m-body" d="M30 65 
           C30 35, 35 25, 45 25 
           C50 25, 50 45, 50 45 
           C50 45, 50 25, 55 25 
           C65 25, 70 35, 70 65" 
        fill="none" 
        stroke="url(#mindlytic-grad)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#soft-glow)" />

  <!-- AI Flare -->
  <path class="flare" d="M82 18 C82 21 79 23 77 23 C79 23 82 25 82 28 C82 25 85 23 87 23 C85 23 82 21 82 18Z" 
        fill="#7C0E44" />

  <!-- Base Accent Pill -->
  <rect x="36" y="74" width="28" height="5" rx="2.5" fill="#AA5E7A" opacity="0.85" />
</svg>
