  <rect x="329" y="358" width="9" height="64" rx="4.5" fill="#D49A9A" />
  <rect x="347" y="328" width="9" height="124" rx="4.5" fill="#7C0E44" />
  <rect x="365" y="350" width="9" height="80" rx="4.5" fill="#AA5E7A" />
  <rect x="383" y="338" width="9" height="104" rx="4.5" fill="#7C0E44" />
  <rect x="401" y="362" width="9" height="56" rx="4.5" fill="#D49A9A" />
  <rect x="419" y="340" width="9" height="100" rx="4.5" fill="#AA5E7A" />
  <rect x="437" y="352" width="9" height="76" rx="4.5" fill="#7C0E44" />
