<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF3F0" />
      <stop offset="0.6" stop-color="#F5E4DC" />
      <stop offset="1" stop-color="#EED3C5" />
    </linearGradient>
    <radialGradient id="p4-glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 110) rotate(120) scale(340 340)">
      <stop stop-color="#D49A9A" stop-opacity="0.35" />
      <stop offset="1" stop-color="#D49A9A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="p4-glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 600) rotate(30) scale(300 240)">
      <stop stop-color="#AA5E7A" stop-opacity="0.25" />
      <stop offset="1" stop-color="#AA5E7A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="p4-micGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop stop-color="#7C0E44" />
      <stop offset="1" stop-color="#54082D" />
    </linearGradient>
    <linearGradient id="p4-btnPrimary" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7C0E44" />
      <stop offset="1" stop-color="#931A56" />
    </linearGradient>
    <linearGradient id="p4-btnSecondary" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#AA5E7A" />
      <stop offset="1" stop-color="#BF7490" />
    </linearGradient>
    <filter id="p4-shadow" x="70" y="46" width="1060" height="585" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="1200" height="675" fill="url(#p4-bg)" />
  <circle cx="1050" cy="110" r="280" fill="url(#p4-glowA)" />
  <circle cx="140" cy="600" r="240" fill="url(#p4-glowB)" />

  <!-- Main Card Container -->
  <g filter="url(#p4-shadow)">
    <rect x="110" y="76" width="980" height="522" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Left Visualizer Console -->
  <rect x="150" y="118" width="370" height="438" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.1)" stroke-width="1.5" />

  <!-- Microphone Icon Badge -->
  <circle cx="335" cy="216" r="62" fill="#FFFFFF" stroke="#AA5E7A" stroke-width="2" stroke-opacity="0.3" />
  <rect x="320" y="174" width="30" height="52" rx="15" fill="url(#p4-micGrad)" />
  <path d="M303 210C303 227.673 317.327 242 335 242C352.673 242 367 227.673 367 210" stroke="#7C0E44" stroke-width="4.5" stroke-linecap="round" />
  <rect x="332.5" y="243" width="5" height="22" rx="2.5" fill="#7C0E44" />
  <rect x="317" y="265" width="36" height="6" rx="3" fill="#7C0E44" />

  <!-- Soundwave Equalizer Bars -->
