<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF3F0" />
      <stop offset="100%" stop-color="#F2DACE" />
    </linearGradient>
    <linearGradient id="p4-wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="100%" stop-color="#AA5E7A" />
    </linearGradient>
    <linearGradient id="p4-waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="50%" stop-color="#AA5E7A" />
      <stop offset="100%" stop-color="#D49A9A" />
    </linearGradient>
    <filter id="p4-shadow" x="60" y="40" width="1080" height="595" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#p4-bg)" />
  <circle cx="1080" cy="120" r="260" fill="#D49A9A" fill-opacity="0.25" />
  <circle cx="120" cy="560" r="220" fill="#AA5E7A" fill-opacity="0.18" />

  <!-- Main Container -->
  <g filter="url(#p4-shadow)">
    <rect x="110" y="70" width="980" height="535" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Header -->
  <circle cx="160" cy="115" r="6" fill="#7C0E44" />
  <circle cx="178" cy="115" r="6" fill="#AA5E7A" />
  <circle cx="196" cy="115" r="6" fill="#D49A9A" />
  <text x="222" y="122" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">
    TEXT TO SPEECH
  </text>
  <text x="445" y="121" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="14" font-weight="500">
    Natural Browser Speech Synthesis &amp; Frequency Audio Visualizer
  </text>

  <!-- Left Side: Text Input Prompt Card -->
  <rect x="160" y="165" width="410" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />
  
  <rect x="190" y="195" width="140" height="32" rx="16" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
  <circle cx="206" cy="211" r="5" fill="#7C0E44" />
  <text x="220" y="216" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">INPUT TEXT</text>

  <rect x="190" y="245" width="350" height="200" rx="16" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
  <text x="216" y="295" fill="#231219" font-family="'Manrope', sans-serif" font-size="18" font-weight="600">
    "Hello world! Synthesize
  </text>
  <text x="216" y="325" fill="#231219" font-family="'Manrope', sans-serif" font-size="18" font-weight="600">
    natural speech with clarity,
  </text>
  <text x="216" y="355" fill="#231219" font-family="'Manrope', sans-serif" font-size="18" font-weight="600">
    pitch, and speed controls."
  </text>

  <!-- Cursor Indicator -->
  <rect x="445" y="338" width="3" height="22" rx="1.5" fill="#7C0E44" />

  <!-- Action Bar inside Left Card -->
  <rect x="190" y="475" width="160" height="44" rx="22" fill="url(#p4-wine)" />
  <!-- Play triangle -->
  <polygon points="218,490 218,504 232,497" fill="#FFFFFF" />
  <text x="242" y="503" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">PLAY VOICE</text>

  <rect x="365" y="475" width="110" height="44" rx="22" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.2)" stroke-width="1.5" />
  <text x="420" y="503" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">PAUSE</text>

  <!-- Right Side: Vibrant Acoustic Soundwave Canvas -->
  <rect x="610" y="165" width="430" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <!-- Speaker Cone / Acoustic Emitter Icon -->
  <g transform="translate(650, 205)">
    <circle cx="40" cy="40" r="36" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" stroke-width="1.5" />
    <!-- Speaker Body -->
    <path d="M26 34 H34 L46 24 V56 L34 46 H26 Z" fill="#7C0E44" />
    <!-- Dynamic sound arcs -->
    <path d="M52 30 C56 34 56 46 52 50" stroke="#AA5E7A" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M58 24 C64 30 64 50 58 56" stroke="#7C0E44" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <text x="745" y="235" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">
    AUDIO OUTPUT
  </text>
  <text x="745" y="258" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">
    Live Speech Waveform • 44.1 kHz
  </text>

  <!-- Soundwave Equalizer Bars (Minimal, Bold & High Contrast) -->
  <g transform="translate(650, 310)">
    <rect x="10" y="40" width="14" height="60" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="36" y="20" width="14" height="100" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="62" y="5" width="14" height="130" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="88" y="30" width="14" height="80" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="114" y="0" width="14" height="140" rx="7" fill="url(#p4-wine)" />
    <rect x="140" y="25" width="14" height="90" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="166" y="10" width="14" height="120" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="192" y="35" width="14" height="70" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="218" y="0" width="14" height="140" rx="7" fill="url(#p4-wine)" />
    <rect x="244" y="15" width="14" height="110" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="270" y="30" width="14" height="80" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="296" y="10" width="14" height="120" rx="7" fill="url(#p4-waveGrad)" />
    <rect x="322" y="45" width="14" height="50" rx="7" fill="url(#p4-waveGrad)" />
  </g>

  <!-- Bottom Voice Badge & Modulation Stats -->
  <g transform="translate(650, 485)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="80" y="22" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">VOICE: NATURAL</text>

    <rect x="180" y="0" width="160" height="34" rx="17" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="260" y="22" text-anchor="middle" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">RATE: 1.0X NORMAL</text>
  </g>
</svg>
