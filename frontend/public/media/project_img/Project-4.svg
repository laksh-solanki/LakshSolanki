  <rect x="473" y="346" width="9" height="88" rx="4.5" fill="#AA5E7A" />

  <!-- Right Top: Content Panel -->
  <rect x="546" y="118" width="504" height="210" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.1)" stroke-width="1.5" />
  <text x="578" y="168" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em">TEXT TO SPEECH STUDIO</text>
  <text x="578" y="204" fill="#4E3842" font-family="'Manrope', -apple-system, sans-serif" font-size="16" font-weight="500">Natural voice synthesis, speed &amp; pitch modulation.</text>
  <text x="578" y="230" fill="#7E636E" font-family="'Manrope', -apple-system, sans-serif" font-size="15">Built for accessibility-first audio workflows.</text>

  <!-- Language Tags -->
  <rect x="578" y="262" width="92" height="32" rx="16" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.18)" />
  <text x="604" y="283" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">EN-US</text>

  <rect x="682" y="262" width="92" height="32" rx="16" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.18)" />
  <text x="709" y="283" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">HI-IN</text>

  <rect x="786" y="262" width="128" height="32" rx="16" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.18)" />
  <text x="804" y="283" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">MULTI VOICE</text>

  <!-- Right Bottom: Controls Panel -->
  <rect x="546" y="346" width="504" height="210" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.1)" stroke-width="1.5" />

  <!-- Speed / Rate Slider -->
  <text x="578" y="392" fill="#231219" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Rate</text>
  <rect x="640" y="382" width="380" height="10" rx="5" fill="#E8D5CD" />
  <rect x="640" y="382" width="245" height="10" rx="5" fill="#7C0E44" />
  <circle cx="885" cy="387" r="11" fill="#FFFFFF" stroke="#7C0E44" stroke-width="3" />

  <!-- Pitch Slider -->
  <text x="578" y="434" fill="#231219" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Pitch</text>
  <rect x="640" y="424" width="380" height="10" rx="5" fill="#E8D5CD" />
  <rect x="640" y="424" width="190" height="10" rx="5" fill="#AA5E7A" />
  <circle cx="830" cy="429" r="11" fill="#FFFFFF" stroke="#AA5E7A" stroke-width="3" />

  <!-- Primary Buttons -->
  <rect x="578" y="472" width="120" height="46" rx="14" fill="url(#p4-btnPrimary)" />
  <path d="M628 488L644 495L628 502V488Z" fill="#FFFFFF" />

  <rect x="712" y="472" width="120" height="46" rx="14" fill="url(#p4-btnSecondary)" />
  <rect x="760" y="487" width="8" height="16" rx="3" fill="#FFFFFF" />
  <rect x="774" y="487" width="8" height="16" rx="3" fill="#FFFFFF" />

  <rect x="846" y="472" width="120" height="46" rx="14" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.2)" stroke-width="1.5" />
