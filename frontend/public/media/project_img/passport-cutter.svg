<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF3F0" />
      <stop offset="0.65" stop-color="#F5E4DC" />
      <stop offset="1" stop-color="#EED3C5" />
    </linearGradient>
    <linearGradient id="pc-card" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FCF9F7" />
    </linearGradient>
    <linearGradient id="pc-accent" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0" stop-color="#7C0E44" />
      <stop offset="1" stop-color="#54082D" />
    </linearGradient>
    <radialGradient id="pc-glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 120) scale(340 340)">
      <stop stop-color="#D49A9A" stop-opacity="0.32" />
      <stop offset="1" stop-color="#D49A9A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pc-glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 640) scale(300 240)">
      <stop stop-color="#AA5E7A" stop-opacity="0.22" />
      <stop offset="1" stop-color="#AA5E7A" stop-opacity="0" />
    </radialGradient>
    <filter id="pc-shadow" x="180" y="70" width="840" height="580" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#pc-bg)" />
  <circle cx="1080" cy="120" r="280" fill="url(#pc-glowA)" />
  <circle cx="120" cy="640" r="250" fill="url(#pc-glowB)" />

  <g filter="url(#pc-shadow)">
    <rect x="220" y="90" width="760" height="520" rx="28" fill="url(#pc-card)" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
    
    <!-- Photo Frame (Left) -->
    <rect x="270" y="140" width="350" height="420" rx="18" fill="#FAF3F0" stroke="#AA5E7A" stroke-width="2" />
    <rect x="296" y="168" width="298" height="364" rx="12" fill="#FFFFFF" />
    <rect x="312" y="184" width="266" height="332" rx="10" fill="url(#pc-accent)" />

    <!-- Portrait Silhouette -->
    <ellipse cx="445" cy="305" rx="64" ry="76" fill="#FCEEE8" />
    <path d="M375 480C375 405 405 372 445 372C485 372 515 405 515 480H375Z" fill="#FAF3F0" />

    <!-- Spec Bars (Right) -->
    <rect x="660" y="170" width="180" height="24" rx="12" fill="#7C0E44" />
    <text x="682" y="187" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">35 mm x 45 mm</text>

    <rect x="660" y="210" width="220" height="20" rx="10" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="674" y="225" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Standard Passport Size</text>

    <rect x="660" y="260" width="260" height="18" rx="9" fill="#FAF3F0" />
    <rect x="660" y="292" width="230" height="18" rx="9" fill="#FAF3F0" />
    <rect x="660" y="324" width="250" height="18" rx="9" fill="#FAF3F0" />

    <!-- Action Button -->
    <rect x="660" y="440" width="240" height="56" rx="16" fill="#7C0E44" />
    <text x="704" y="475" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">PRINT READY</text>
    <path d="M848 468L856 476L872 460" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="120" y="652" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">Passport Cutter</text>
  <text x="121" y="688" fill="#4E3842" font-family="'Manrope', -apple-system, sans-serif" font-size="20" font-weight="600">35 mm x 45 mm - Auto Border Guides - Clean Background Isolation</text>
</svg>