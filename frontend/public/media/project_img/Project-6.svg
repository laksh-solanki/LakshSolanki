<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p6-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF3F0" />
      <stop offset="100%" stop-color="#F2DACE" />
    </linearGradient>
    <linearGradient id="p6-wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="100%" stop-color="#AA5E7A" />
    </linearGradient>
    <filter id="p6-shadow" x="60" y="40" width="1080" height="595" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#p6-bg)" />
  <circle cx="1080" cy="120" r="260" fill="#D49A9A" fill-opacity="0.25" />
  <circle cx="120" cy="560" r="220" fill="#AA5E7A" fill-opacity="0.18" />

  <!-- Main Shell -->
  <g filter="url(#p6-shadow)">
    <rect x="110" y="70" width="980" height="535" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Header -->
  <circle cx="160" cy="115" r="6" fill="#7C0E44" />
  <circle cx="178" cy="115" r="6" fill="#AA5E7A" />
  <circle cx="196" cy="115" r="6" fill="#D49A9A" />
  <text x="222" y="122" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">
    JSON FORGE STUDIO
  </text>
  <text x="470" y="121" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="14" font-weight="500">
    Schema Validation • Formatter &amp; Minifier • Deep Tree Diff
  </text>

  <!-- Left: Syntax Highlighted JSON Editor -->
  <rect x="160" y="165" width="480" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <!-- Editor Window Top -->
  <rect x="185" y="190" width="430" height="34" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
  <text x="205" y="212" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">payload.json</text>
  <rect x="520" y="196" width="85" height="22" rx="11" fill="#DCFCE7" stroke="#86EFAC" />
  <text x="562" y="211" text-anchor="middle" fill="#15803D" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800">VALID JSON</text>

  <!-- JSON Code Body -->
  <rect x="185" y="235" width="430" height="300" rx="14" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
  
  <!-- Line Numbers column -->
  <rect x="185" y="235" width="42" height="300" rx="14" fill="#FAF3F0" />
  <text x="206" y="272" text-anchor="middle" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="13">1</text>
  <text x="206" y="304" text-anchor="middle" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="13">2</text>
  <text x="206" y="336" text-anchor="middle" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="13">3</text>
  <text x="206" y="368" text-anchor="middle" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="13">4</text>
  <text x="206" y="400" text-anchor="middle" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="13">5</text>
  <text x="206" y="432" text-anchor="middle" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="13">6</text>
  <text x="206" y="464" text-anchor="middle" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="13">7</text>
  <text x="206" y="496" text-anchor="middle" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="13">8</text>

  <!-- Code text with syntax highlight colors -->
  <text x="245" y="272" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">{</text>
  
  <text x="265" y="304" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">"status"</text>
  <text x="335" y="304" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="14">: </text>
  <text x="350" y="304" fill="#0D9488" font-family="'JetBrains Mono', monospace" font-size="14">"success"</text>
  <text x="425" y="304" fill="#7E636E" font-family="'JetBrains Mono', monospace" font-size="14">,</text>

  <text x="265" y="336" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">"version"</text>
  <text x="345" y="336" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="14">: </text>
  <text x="360" y="336" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">2.4</text>
  <text x="388" y="336" fill="#7E636E" font-family="'JetBrains Mono', monospace" font-size="14">,</text>

  <text x="265" y="368" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">"minify"</text>
  <text x="330" y="368" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="14">: </text>
  <text x="345" y="368" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">true</text>
  <text x="385" y="368" fill="#7E636E" font-family="'JetBrains Mono', monospace" font-size="14">,</text>

  <text x="265" y="400" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">"tokens"</text>
  <text x="330" y="400" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="14">: [</text>
  <text x="350" y="400" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="14">"diff"</text>
  <text x="390" y="400" fill="#7E636E" font-family="'JetBrains Mono', monospace" font-size="14">, </text>
  <text x="405" y="400" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="14">"sort"</text>
  <text x="445" y="400" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="14">],</text>

  <text x="265" y="432" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">"sizeKb"</text>
  <text x="335" y="432" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="14">: </text>
  <text x="350" y="432" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">14.8</text>

  <text x="245" y="464" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">}</text>

  <!-- Right: Clean Tree Explorer & Tool Actions -->
  <rect x="670" y="165" width="370" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <!-- Curly Braces Hero Icon -->
  <g transform="translate(710, 205)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#p6-wine)" />
    <text x="30" y="41" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800">{ }</text>
  </g>

  <text x="785" y="232" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800">STRUCTURE TREE</text>
  <text x="785" y="255" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">Interactive Object Hierarchy</text>

  <!-- Tree Explorer Nodes -->
  <g transform="translate(710, 290)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="290" height="38" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
    <text x="18" y="24" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">▼ root : object [5 keys]</text>

    <!-- Node 2 (indented) -->
    <rect x="20" y="46" width="270" height="38" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
    <text x="38" y="70" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="13">• status : string</text>

    <!-- Node 3 (indented) -->
    <rect x="20" y="92" width="270" height="38" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
    <text x="38" y="116" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="13">• tokens : array [2 items]</text>
  </g>

  <!-- Action Buttons at Bottom -->
  <g transform="translate(710, 475)">
    <rect x="0" y="0" width="135" height="44" rx="22" fill="url(#p6-wine)" />
    <text x="67" y="27" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">FORMAT</text>

    <rect x="150" y="0" width="140" height="44" rx="22" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.2)" stroke-width="1.5" />
    <text x="220" y="27" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">MINIFY</text>
  </g>
</svg>
