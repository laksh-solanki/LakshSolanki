<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p9-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF3F0" />
      <stop offset="100%" stop-color="#F2DACE" />
    </linearGradient>
    <linearGradient id="p9-wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="100%" stop-color="#AA5E7A" />
    </linearGradient>
    <filter id="p9-shadow" x="60" y="40" width="1080" height="595" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#p9-bg)" />
  <circle cx="1080" cy="120" r="260" fill="#D49A9A" fill-opacity="0.25" />
  <circle cx="120" cy="560" r="220" fill="#AA5E7A" fill-opacity="0.18" />

  <!-- Main Shell -->
  <g filter="url(#p9-shadow)">
    <rect x="110" y="70" width="980" height="535" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Header -->
  <circle cx="160" cy="115" r="6" fill="#7C0E44" />
  <circle cx="178" cy="115" r="6" fill="#AA5E7A" />
  <circle cx="196" cy="115" r="6" fill="#D49A9A" />
  <text x="222" y="122" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">
    TRANSLATE STUDIO
  </text>
  <text x="460" y="121" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="14" font-weight="500">
    Multi-Language Neural Translation Workspace • Instant Speech Playback
  </text>

  <!-- Left: Source Panel (English) -->
  <rect x="160" y="165" width="415" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <!-- Source Header Pill -->
  <rect x="185" y="190" width="180" height="34" rx="17" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
  <circle cx="203" cy="207" r="5" fill="#10B981" />
  <text x="216" y="212" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">ENGLISH (DETECTED)</text>

  <!-- Source Card -->
  <rect x="185" y="240" width="365" height="230" rx="14" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
  <text x="210" y="285" fill="#231219" font-family="'Manrope', sans-serif" font-size="17" font-weight="600">Building scalable user interfaces,</text>
  <text x="210" y="318" fill="#231219" font-family="'Manrope', sans-serif" font-size="17" font-weight="600">developer toolsets, and clean</text>
  <text x="210" y="351" fill="#231219" font-family="'Manrope', sans-serif" font-size="17" font-weight="600">modern web experiences with joy.</text>

  <!-- Left Actions -->
  <rect x="185" y="490" width="140" height="42" rx="21" fill="url(#p9-wine)" />
  <circle cx="210" cy="511" r="5" fill="#FFFFFF" />
  <text x="224" y="516" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">VOICE INPUT</text>
  <text x="350" y="516" fill="#7E636E" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">92 chars • 12 words</text>

  <!-- Center Swap Circle with arrows -->
  <g transform="translate(600, 362)">
    <circle cx="0" cy="0" r="30" fill="url(#p9-wine)" />
    <!-- Bi-directional Swap Arrows -->
    <path d="M-10 -5 H10 M6 -9 L10 -5 L6 -1" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M10 5 H-10 M-6 1 L-10 5 L-6 9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right: Target Panel (Spanish) -->
  <rect x="625" y="165" width="415" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <!-- Target Header Pill -->
  <rect x="650" y="190" width="150" height="34" rx="17" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
  <text x="670" y="212" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">SPANISH</text>
  <path d="M765 208 L770 213 L775 208" stroke="#7C0E44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Target Card -->
  <rect x="650" y="240" width="365" height="230" rx="14" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
  <text x="675" y="285" fill="#231219" font-family="'Manrope', sans-serif" font-size="17" font-weight="600">Construyendo interfaces de usuario</text>
  <text x="675" y="318" fill="#231219" font-family="'Manrope', sans-serif" font-size="17" font-weight="600">escalables, herramientas modernas</text>
  <text x="675" y="351" fill="#231219" font-family="'Manrope', sans-serif" font-size="17" font-weight="600">y experiencias web con pasión.</text>

  <!-- Right Actions -->
  <rect x="650" y="490" width="160" height="42" rx="21" fill="url(#p9-wine)" />
  <text x="730" y="516" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">COPY OUTPUT</text>

  <rect x="825" y="490" width="115" height="42" rx="21" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.2)" stroke-width="1.5" />
  <text x="882" y="516" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">LISTEN</text>

  <rect x="950" y="490" width="65" height="42" rx="21" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.2)" stroke-width="1.5" />
  <path d="M982 504 V518 M977 514 L982 518 L987 514" stroke="#AA5E7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
