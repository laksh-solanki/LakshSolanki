<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p8-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF3F0" />
      <stop offset="100%" stop-color="#F2DACE" />
    </linearGradient>
    <linearGradient id="p8-wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="100%" stop-color="#AA5E7A" />
    </linearGradient>
    <filter id="p8-shadow" x="60" y="40" width="1080" height="595" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#p8-bg)" />
  <circle cx="1080" cy="120" r="260" fill="#D49A9A" fill-opacity="0.25" />
  <circle cx="120" cy="560" r="220" fill="#AA5E7A" fill-opacity="0.18" />

  <!-- Main Shell -->
  <g filter="url(#p8-shadow)">
    <rect x="110" y="70" width="980" height="535" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Header -->
  <circle cx="160" cy="115" r="6" fill="#7C0E44" />
  <circle cx="178" cy="115" r="6" fill="#AA5E7A" />
  <circle cx="196" cy="115" r="6" fill="#D49A9A" />
  <text x="222" y="122" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">
    DEV UTILITY HUB
  </text>
  <text x="440" y="121" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="14" font-weight="500">
    Unified Swiss-Army Toolbox • Encoders, Keys, Hashes &amp; Formatters
  </text>

  <!-- 4 Modular Utility Cards Grid -->

  <!-- Tile 1: Base64 & URL (Top-Left) -->
  <g transform="translate(160, 165)">
    <rect width="425" height="180" rx="18" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />
    <!-- Icon Box -->
    <rect x="24" y="24" width="48" height="48" rx="12" fill="url(#p8-wine)" />
    <text x="48" y="55" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">64</text>
    
    <text x="88" y="44" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800">Base64 &amp; URL Codec</text>
    <text x="88" y="66" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">Bi-directional string encoding</text>

    <!-- Sample pill -->
    <rect x="24" y="92" width="377" height="34" rx="8" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
    <text x="38" y="114" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="13">SGVsbG8gV29ybGQh...</text>

    <!-- Action Tags -->
    <rect x="24" y="136" width="80" height="24" rx="6" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="64" y="152" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">ENCODE</text>
    <rect x="114" y="136" width="80" height="24" rx="6" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="154" y="152" text-anchor="middle" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">DECODE</text>
  </g>

  <!-- Tile 2: Password Generator (Top-Right) -->
  <g transform="translate(615, 165)">
    <rect width="425" height="180" rx="18" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />
    <!-- Icon Box -->
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#7C0E44" />
    <!-- Lock Path -->
    <path d="M42 46V41C42 37.68 44.68 35 48 35C51.32 35 54 37.68 54 41V46M39 46H57C58.1 46 59 46.9 59 48V56C59 57.1 58.1 58 57 58H39C37.9 58 37 57.1 37 56V48C37 46.9 37.9 46 39 46Z" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    
    <text x="88" y="44" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800">Password &amp; Entropy</text>
    <text x="88" y="66" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">Cryptographic secure tokens</text>

