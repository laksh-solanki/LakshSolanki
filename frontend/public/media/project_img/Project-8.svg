    <rect x="24" y="92" width="377" height="34" rx="8" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
    <text x="38" y="114" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">k9#Px!8Lm@92Q$vR</text>

    <rect x="24" y="136" width="100" height="24" rx="6" fill="#7C0E44" />
    <text x="74" y="152" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">GENERATE</text>
    <text x="140" y="152" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">128-BIT ENTROPY</text>
  </g>

  <!-- Tile 3: UUID v4 (Bottom-Left) -->
  <g transform="translate(160, 370)">
    <rect width="425" height="180" rx="18" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />
    <!-- Icon Box -->
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#AA5E7A" />
    <!-- Zap Lightning icon -->
    <path d="M50 32 L40 45 H49 L46 58 L56 44 H47 Z" fill="#FFFFFF" />

    <text x="88" y="44" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800">UUID v4 Generator</text>
    <text x="88" y="66" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">RFC 4122 compliant identifiers</text>

    <!-- Sample pill -->
    <rect x="24" y="92" width="377" height="34" rx="8" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
    <text x="38" y="114" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="13">e4d909c2-9014-4c8d-bf84-...</text>

    <rect x="24" y="136" width="100" height="24" rx="6" fill="#AA5E7A" />
    <text x="74" y="152" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">NEW UUID</text>
    <text x="140" y="152" fill="#7E636E" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">BATCH SUPPORT</text>
  </g>

  <!-- Tile 4: Case Converter (Bottom-Right) -->
  <g transform="translate(615, 370)">
    <rect width="425" height="180" rx="18" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />
    <!-- Icon Box -->
    <rect x="24" y="24" width="48" height="48" rx="12" fill="url(#p8-wine)" />
    <text x="48" y="55" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800">Aa</text>

    <text x="88" y="44" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800">Text Case Transformer</text>
    <text x="88" y="66" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">Format variable &amp; code casing</text>

    <!-- Sample pill -->
    <rect x="24" y="92" width="377" height="34" rx="8" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
    <text x="38" y="114" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="13">camelCase • kebab-case • CONST</text>

    <rect x="24" y="136" width="80" height="24" rx="6" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="64" y="152" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">CAMEL</text>
    <rect x="114" y="136" width="80" height="24" rx="6" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="154" y="152" text-anchor="middle" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">KEBAB</text>
    <rect x="204" y="136" width="80" height="24" rx="6" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="244" y="152" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">SNAKE</text>
  </g>
</svg>
