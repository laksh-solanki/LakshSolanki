<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p10-bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF3F0" />
      <stop offset="0.65" stop-color="#F5E4DC" />
      <stop offset="1" stop-color="#EED3C5" />
    </linearGradient>
    <radialGradient id="p10-glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 120) scale(340 340)">
      <stop stop-color="#D49A9A" stop-opacity="0.32" />
      <stop offset="1" stop-color="#D49A9A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="p10-glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 620) scale(300 240)">
      <stop stop-color="#AA5E7A" stop-opacity="0.22" />
      <stop offset="1" stop-color="#AA5E7A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="p10-portrait" x1="0" y1="0" x2="0" y2="100%">
      <stop stop-color="#7C0E44" />
      <stop offset="1" stop-color="#52072D" />
    </linearGradient>
    <filter id="p10-shadow" x="70" y="46" width="1060" height="608" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" fill="url(#p10-bg)" />
  <circle cx="1080" cy="120" r="280" fill="url(#p10-glowA)" />
  <circle cx="120" cy="620" r="240" fill="url(#p10-glowB)" />

  <!-- Main Container -->
  <g filter="url(#p10-shadow)">
    <rect x="110" y="70" width="980" height="560" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Header -->
  <text x="150" y="132" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">PASSPORT PHOTO CUTTER</text>
  <text x="150" y="164" fill="#4E3842" font-family="'Manrope', -apple-system, sans-serif" font-size="16" font-weight="500">Auto background removal, standard 35 × 45 mm canvas fitting &amp; print border guides.</text>

  <!-- Workflow Stage -->
  <rect x="150" y="196" width="900" height="392" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.1)" stroke-width="1.5" />

  <!-- Step 1: Upload Card -->
  <rect x="190" y="236" width="290" height="312" rx="16" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" stroke-width="1.5" />
  <text x="216" y="272" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">1. RAW UPLOAD</text>

  <!-- Silhouette in raw frame -->
  <circle cx="335" cy="350" r="44" fill="#D49A9A" />
  <path d="M260 480C260 430 294 400 335 400C376 400 410 430 410 480H260Z" fill="#AA5E7A" />

  <!-- Crop overlay guidelines -->
  <rect x="235" y="295" width="200" height="230" fill="none" stroke="#7C0E44" stroke-width="2" stroke-dasharray="6 6" rx="10" />

  <!-- Transition Arrow Badge -->
  <circle cx="530" cy="392" r="34" fill="#7C0E44" />
  <path d="M518 392H542M536 384L544 392L536 400" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Step 2: Formatted Passport Output -->
  <rect x="580" y="236" width="430" height="312" rx="16" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" stroke-width="1.5" />
  <text x="606" y="272" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">2. EXPORT READY (35 × 45 mm)</text>

  <!-- Passport Card Preview -->
  <rect x="606" y="295" width="180" height="230" rx="8" fill="#FAF3F0" stroke="#7C0E44" stroke-width="2" />
  <circle cx="696" cy="360" r="38" fill="#AA5E7A" />
  <path d="M632 485C632 440 660 412 696 412C732 412 760 440 760 485H632Z" fill="url(#p10-portrait)" />

  <!-- Spec details on right side of card -->
  <rect x="814" y="295" width="170" height="36" rx="10" fill="#FAF3F0" />
  <text x="828" y="318" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">35 mm × 45 mm</text>

  <rect x="814" y="343" width="170" height="36" rx="10" fill="#FAF3F0" />
  <text x="828" y="366" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">White Background</text>

  <rect x="814" y="391" width="170" height="36" rx="10" fill="#FAF3F0" />
  <text x="828" y="414" fill="#7E636E" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">300 DPI Print Spec</text>

  <rect x="814" y="465" width="170" height="48" rx="14" fill="#7C0E44" />
  <text x="842" y="495" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">DOWNLOAD</text>
</svg>
