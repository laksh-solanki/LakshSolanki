<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p7-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF3F0" />
      <stop offset="0.65" stop-color="#F5E4DC" />
      <stop offset="1" stop-color="#EED3C5" />
    </linearGradient>
    <radialGradient id="p7-glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 120) scale(320 320)">
      <stop stop-color="#D49A9A" stop-opacity="0.3" />
      <stop offset="1" stop-color="#D49A9A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="p7-glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 620) scale(300 240)">
      <stop stop-color="#AA5E7A" stop-opacity="0.22" />
      <stop offset="1" stop-color="#AA5E7A" stop-opacity="0" />
    </radialGradient>
    <filter id="p7-shadow" x="70" y="46" width="1060" height="585" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#p7-bg)" />
  <circle cx="1080" cy="120" r="260" fill="url(#p7-glowA)" />
  <circle cx="120" cy="620" r="240" fill="url(#p7-glowB)" />

  <!-- Main Container -->
  <g filter="url(#p7-shadow)">
    <rect x="110" y="76" width="980" height="522" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Left: Source Editor Window -->
  <rect x="150" y="118" width="410" height="438" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.1)" stroke-width="1.5" />
  <circle cx="180" cy="144" r="6" fill="#7C0E44" />
  <circle cx="198" cy="144" r="6" fill="#AA5E7A" />
  <circle cx="216" cy="144" r="6" fill="#D49A9A" />
  <line x1="150" y1="166" x2="560" y2="166" stroke="rgba(124, 14, 68, 0.08)" stroke-width="1" />

  <!-- Code text -->
  <text x="180" y="210" fill="#7C0E44" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="700">&lt;main&gt;</text>
  <text x="206" y="248" fill="#AA5E7A" font-family="'JetBrains Mono', Consolas, monospace" font-size="18">&lt;h1 class="hero"&gt;</text>
  <text x="232" y="284" fill="#231219" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="600">Web Lab Live</text>
  <text x="206" y="320" fill="#AA5E7A" font-family="'JetBrains Mono', Consolas, monospace" font-size="18">&lt;/h1&gt;</text>
  
  <text x="206" y="360" fill="#AA5E7A" font-family="'JetBrains Mono', Consolas, monospace" font-size="18">&lt;script&gt;</text>
  <text x="232" y="396" fill="#7C0E44" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="600">const run = () =&gt; true;</text>
  <text x="206" y="432" fill="#AA5E7A" font-family="'JetBrains Mono', Consolas, monospace" font-size="18">&lt;/script&gt;</text>
  <text x="180" y="470" fill="#7C0E44" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="700">&lt;/main&gt;</text>

  <!-- Right Top: Live Viewport -->
  <rect x="586" y="118" width="464" height="240" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.1)" stroke-width="1.5" />
  <circle cx="616" cy="144" r="6" fill="#AA5E7A" />
  <circle cx="634" cy="144" r="6" fill="#D49A9A" />
  <line x1="586" y1="166" x2="1050" y2="166" stroke="rgba(124, 14, 68, 0.08)" stroke-width="1" />

  <text x="616" y="210" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="800">WEB LAB COMPILER</text>
  <text x="616" y="240" fill="#4E3842" font-family="'Manrope', sans-serif" font-size="15">Instant in-browser preview with zero build latency.</text>

  <!-- Interactive Demo Button inside viewport -->
  <rect x="616" y="270" width="160" height="42" rx="12" fill="#7C0E44" />
  <text x="652" y="296" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">COMPILE &amp; RUN</text>

  <!-- Right Bottom: Telemetry Console -->
