  <text x="616" y="416" fill="#231219" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Runtime Telemetry</text>

  <!-- Telemetry Pills -->
  <rect x="616" y="438" width="128" height="34" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
  <text x="632" y="460" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">FPS: 60.0</text>

  <rect x="756" y="438" width="128" height="34" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
  <text x="772" y="460" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">MEM: 12MB</text>

  <rect x="896" y="438" width="128" height="34" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
  <text x="914" y="460" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">TIME: 4ms</text>

  <text x="616" y="520" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="14">Sandbox active • Secure iframe isolation verified</text>
