<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p7-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF3F0" />
      <stop offset="100%" stop-color="#F2DACE" />
    </linearGradient>
    <linearGradient id="p7-wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="100%" stop-color="#AA5E7A" />
    </linearGradient>
    <filter id="p7-shadow" x="60" y="40" width="1080" height="595" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#p7-bg)" />
  <circle cx="1080" cy="120" r="260" fill="#D49A9A" fill-opacity="0.25" />
  <circle cx="120" cy="560" r="220" fill="#AA5E7A" fill-opacity="0.18" />

  <!-- Main Shell -->
  <g filter="url(#p7-shadow)">
    <rect x="110" y="70" width="980" height="535" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Header -->
  <circle cx="160" cy="115" r="6" fill="#7C0E44" />
  <circle cx="178" cy="115" r="6" fill="#AA5E7A" />
  <circle cx="196" cy="115" r="6" fill="#D49A9A" />
  <text x="222" y="122" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">
    WEB LAB COMPILER
  </text>
  <text x="475" y="121" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="14" font-weight="500">
    In-Browser Live HTML / CSS / JS Sandbox &amp; Runtime Metrics
  </text>

  <!-- Left: Source Code Window -->
  <rect x="160" y="165" width="425" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <rect x="185" y="190" width="375" height="34" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
  <text x="205" y="212" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">index.html + script.js</text>
  
  <rect x="475" y="196" width="75" height="22" rx="11" fill="url(#p7-wine)" />
  <text x="512" y="211" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800">RUNNING</text>

  <!-- Code Area -->
  <rect x="185" y="235" width="375" height="245" rx="14" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
  <text x="210" y="275" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">&lt;div class="card"&gt;</text>
  <text x="230" y="307" fill="#AA5E7A" font-family="'JetBrains Mono', monospace" font-size="14">&lt;h2&gt;Live Component&lt;/h2&gt;</text>
  <text x="230" y="339" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="14">&lt;button id="btn"&gt;</text>
  <text x="250" y="371" fill="#0D9488" font-family="'JetBrains Mono', monospace" font-size="14">Click to Compute</text>
  <text x="230" y="403" fill="#231219" font-family="'JetBrains Mono', monospace" font-size="14">&lt;/button&gt;</text>
  <text x="210" y="435" fill="#7C0E44" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">&lt;/div&gt;</text>
  
  <!-- Run Button at bottom left -->
  <rect x="185" y="495" width="160" height="42" rx="21" fill="url(#p7-wine)" />
  <polygon points="215,508 215,524 230,516" fill="#FFFFFF" />
  <text x="240" y="522" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">COMPILE &amp; RUN</text>

  <!-- Right: Live Output Viewport -->
  <rect x="615" y="165" width="425" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <rect x="640" y="190" width="375" height="34" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
  <!-- Browser URL bar -->
  <circle cx="658" cy="207" r="4" fill="#7C0E44" />
  <text x="674" y="212" fill="#7E636E" font-family="'JetBrains Mono', monospace" font-size="11">localhost:3000/preview</text>

  <!-- Rendered UI Container -->
  <rect x="640" y="235" width="375" height="205" rx="14" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.1)" />
  
  <!-- Rendered Card Component inside browser -->
  <g transform="translate(675, 260)">
    <rect x="0" y="0" width="305" height="155" rx="12" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.15)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="12" fill="url(#p7-wine)" />
    <text x="50" y="34" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800">Live Component</text>
    <rect x="20" y="55" width="265" height="6" rx="3" fill="#E8D5CD" />
    <rect x="20" y="69" width="200" height="6" rx="3" fill="#E8D5CD" />
    
    <!-- Rendered button -->
    <rect x="20" y="95" width="160" height="36" rx="18" fill="url(#p7-wine)" />
    <text x="100" y="118" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">CLICK TO COMPUTE</text>
  </g>

  <!-- Runtime Telemetry Pills at bottom right -->
  <g transform="translate(640, 460)">
    <rect x="0" y="0" width="115" height="34" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" />
    <text x="57" y="22" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">FPS: 60</text>

    <rect x="130" y="0" width="115" height="34" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" />
    <text x="187" y="22" text-anchor="middle" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">LATENCY: 2ms</text>

    <rect x="260" y="0" width="115" height="34" rx="10" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" />
    <text x="317" y="22" text-anchor="middle" fill="#0D9488" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">MEMORY: 8MB</text>
  </g>

  <text x="827" y="525" text-anchor="middle" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">
    Isolated Iframe Sandbox • Zero Latency
  </text>
</svg>
