<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF3F0" />
      <stop offset="100%" stop-color="#F2DACE" />
    </linearGradient>
    <linearGradient id="p2-wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="100%" stop-color="#AA5E7A" />
    </linearGradient>
    <linearGradient id="p2-pdf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="p2-shadow" x="60" y="40" width="1080" height="595" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#p2-bg)" />
  <circle cx="1080" cy="120" r="260" fill="#D49A9A" fill-opacity="0.25" />
  <circle cx="120" cy="560" r="220" fill="#AA5E7A" fill-opacity="0.18" />

  <!-- Main Shell Container -->
  <g filter="url(#p2-shadow)">
    <rect x="110" y="70" width="980" height="535" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Header -->
  <circle cx="160" cy="115" r="6" fill="#7C0E44" />
  <circle cx="178" cy="115" r="6" fill="#AA5E7A" />
  <circle cx="196" cy="115" r="6" fill="#D49A9A" />
  <text x="222" y="122" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">
    PDF &amp; IMAGE STUDIO
  </text>
  <text x="490" y="121" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="14" font-weight="500">
    Two-Way Batch Image to PDF &amp; Page Extraction
  </text>

  <!-- Left Card: Image Collection (JPG / PNG) -->
  <rect x="160" y="165" width="360" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />
  
  <!-- Stacked Image visual -->
  <g transform="translate(195, 205)">
    <!-- Back card 2 -->
    <rect x="24" y="-12" width="240" height="170" rx="14" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" />
    <!-- Back card 1 -->
    <rect x="12" y="-6" width="240" height="170" rx="14" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <!-- Front card -->
    <rect x="0" y="0" width="240" height="170" rx="14" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.2)" stroke-width="1.5" />
    
    <!-- Photo Graphic inside front card -->
    <rect x="14" y="14" width="212" height="142" rx="10" fill="#FCECE6" />
    <circle cx="56" cy="52" r="16" fill="#AA5E7A" opacity="0.6" />
    <!-- Mountain peaks -->
    <path d="M26 135 L86 65 L140 120 L176 84 L216 135 Z" fill="#7C0E44" opacity="0.85" />
    <path d="M110 135 L156 90 L206 135 Z" fill="#AA5E7A" opacity="0.6" />
  </g>

  <text x="340" y="435" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">
    IMAGE BATCH
  </text>
  <text x="340" y="465" text-anchor="middle" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">
    PNG, JPG, WebP formats
  </text>
  <rect x="250" y="495" width="180" height="38" rx="19" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.18)" />
  <text x="340" y="519" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="0.04em">
    IMPORT IMAGES
  </text>

  <!-- Center Conversion Flow Indicator -->
  <g transform="translate(600, 362)">
    <circle cx="0" cy="0" r="32" fill="url(#p2-wine)" />
    <!-- Double conversion arrow -->
    <path d="M-12 -6 L12 -6 M6 -12 L12 -6 L6 0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M12 6 L-12 6 M-6 0 L-12 6 L-6 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Card: PDF Document Output -->
  <rect x="680" y="165" width="360" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <!-- PDF Document Visual with folded corner -->
  <g transform="translate(740, 205)">
    <!-- Back page -->
    <rect x="14" y="-8" width="210" height="175" rx="12" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <!-- Main page -->
    <path d="M0 12 C0 5.37 5.37 0 12 0 H160 L210 50 V175 C210 181.63 204.63 187 198 187 H12 C5.37 187 0 181.63 0 175 Z" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.2)" stroke-width="1.5" />
    <!-- Folded corner tab -->
    <path d="M160 0 V42 C160 46.42 163.58 50 168 50 H210 Z" fill="#F2DACE" stroke="rgba(124, 14, 68, 0.2)" stroke-width="1.5" />
    
    <!-- Red PDF Tag -->
    <rect x="22" y="32" width="60" height="26" rx="6" fill="url(#p2-pdf)" />
    <text x="52" y="49" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800">
      PDF
    </text>

    <!-- Simulated document lines -->
    <rect x="22" y="74" width="130" height="8" rx="4" fill="#E8D5CD" />
    <rect x="22" y="94" width="165" height="6" rx="3" fill="#F2DACE" />
    <rect x="22" y="110" width="150" height="6" rx="3" fill="#F2DACE" />
    <rect x="22" y="126" width="110" height="6" rx="3" fill="#F2DACE" />

    <!-- Stamp icon -->
    <circle cx="165" cy="145" r="18" fill="#FCECE6" stroke="rgba(124, 14, 68, 0.2)" stroke-width="1" />
    <path d="M158 145 L163 150 L173 140" stroke="#7C0E44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="860" y="435" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">
    EXPORTED DOCUMENT
  </text>
  <text x="860" y="465" text-anchor="middle" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">
    High-Res Multi-Page PDF
  </text>
  <rect x="770" y="495" width="180" height="38" rx="19" fill="#7C0E44" />
  <text x="860" y="519" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="0.04em">
    DOWNLOAD PDF
  </text>
</svg>
