<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p5-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF3F0" />
      <stop offset="100%" stop-color="#F2DACE" />
    </linearGradient>
    <linearGradient id="p5-wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="100%" stop-color="#AA5E7A" />
    </linearGradient>
    <linearGradient id="p5-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C0E44" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#AA5E7A" />
    </linearGradient>
    <filter id="p5-shadow" x="60" y="40" width="1080" height="595" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#7C0E44" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#p5-bg)" />
  <circle cx="1080" cy="120" r="260" fill="#D49A9A" fill-opacity="0.25" />
  <circle cx="120" cy="560" r="220" fill="#AA5E7A" fill-opacity="0.18" />

  <!-- Main Shell -->
  <g filter="url(#p5-shadow)">
    <rect x="110" y="70" width="980" height="535" rx="28" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" stroke-width="2" />
  </g>

  <!-- Window Header -->
  <circle cx="160" cy="115" r="6" fill="#7C0E44" />
  <circle cx="178" cy="115" r="6" fill="#AA5E7A" />
  <circle cx="196" cy="115" r="6" fill="#D49A9A" />
  <text x="222" y="122" fill="#7C0E44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">
    MINDLYTIC AI
  </text>
  <text x="400" y="121" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="14" font-weight="500">
    Conversational AI Assistant • Gemini API • Markdown &amp; Code Highlighting
  </text>

  <!-- Left: Interactive Chat Stream -->
  <rect x="160" y="165" width="500" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <!-- User Message Bubble -->
  <g transform="translate(190, 195)">
    <rect x="0" y="0" width="440" height="60" rx="16" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.12)" />
    <!-- User Avatar -->
    <circle cx="30" cy="30" r="14" fill="#7C0E44" />
    <text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">U</text>
    <text x="56" y="27" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">PROMPT</text>
    <text x="56" y="47" fill="#231219" font-family="'Manrope', sans-serif" font-size="14" font-weight="600">Explain async queue handling in Node.js</text>
  </g>

  <!-- AI Response Message Bubble -->
  <g transform="translate(190, 275)">
    <rect x="0" y="0" width="440" height="255" rx="16" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" stroke-width="1.5" />
    
    <!-- AI Sparkle Icon -->
    <circle cx="30" cy="30" r="14" fill="url(#p5-wine)" />
    <path d="M30 22 L32 28 L38 30 L32 32 L30 38 L28 32 L22 30 L28 28 Z" fill="#FFFFFF" />

    <text x="56" y="27" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800">MINDLYTIC AI</text>
    <text x="56" y="52" fill="#231219" font-family="'Manrope', sans-serif" font-size="14" font-weight="600">Here is how asynchronous job workers process tasks:</text>

    <!-- Code Block Inside AI message -->
    <rect x="20" y="72" width="400" height="110" rx="10" fill="#231219" />
    <!-- Code Window Dots -->
    <circle cx="36" cy="88" r="3.5" fill="#EF4444" />
    <circle cx="48" cy="88" r="3.5" fill="#F59E0B" />
    <circle cx="60" cy="88" r="3.5" fill="#10B981" />
    
    <!-- Code lines -->
    <text x="36" y="116" fill="#D49A9A" font-family="'JetBrains Mono', monospace" font-size="12">const queue = new JobQueue();</text>
    <text x="36" y="138" fill="#FAF3F0" font-family="'JetBrains Mono', monospace" font-size="12">await queue.process(async (task) =&gt; {</text>
    <text x="56" y="160" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12">  return handleWork(task.payload);</text>
    <text x="36" y="174" fill="#FAF3F0" font-family="'JetBrains Mono', monospace" font-size="12">});</text>

    <!-- Response metadata pills -->
    <rect x="20" y="200" width="110" height="28" rx="8" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="75" y="218" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">GEMINI FLASH</text>

    <rect x="140" y="200" width="90" height="28" rx="8" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="185" y="218" text-anchor="middle" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">STREAMING</text>
  </g>

  <!-- Right: Mindlytic Intelligence Node & Features -->
  <rect x="690" y="165" width="350" height="395" rx="20" fill="#FAF3F0" stroke="rgba(124, 14, 68, 0.12)" stroke-width="1.5" />

  <!-- Center AI Node Graphic -->
  <g transform="translate(865, 255)">
    <circle cx="0" cy="0" r="54" fill="url(#p5-wine)" />
    <circle cx="0" cy="0" r="42" fill="#FAF3F0" />
    <!-- Radiant 4-point AI Star -->
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="url(#p5-wine)" />
    <!-- Mini accent satellites -->
    <circle cx="28" cy="-28" r="6" fill="#D97706" />
    <circle cx="-28" cy="28" r="5" fill="#AA5E7A" />
  </g>

  <text x="865" y="345" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">
    NEURAL LLM ENGINE
  </text>
  <text x="865" y="375" text-anchor="middle" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">
    Real-Time Markdown &amp; Code Syntax
  </text>

  <!-- Quick Action Prompt Pill -->
  <g transform="translate(720, 415)">
    <rect x="0" y="0" width="290" height="46" rx="23" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.18)" />
    <text x="20" y="28" fill="#7E636E" font-family="'Manrope', sans-serif" font-size="13">Ask anything to AI...</text>
    <!-- Send Arrow -->
    <circle cx="260" cy="23" r="16" fill="url(#p5-wine)" />
    <path d="M255 23 H265 M262 19 L266 23 L262 27" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Feature Pills -->
  <g transform="translate(720, 485)">
    <rect x="0" y="0" width="135" height="34" rx="17" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="67" y="22" text-anchor="middle" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">FAST STREAM</text>

    <rect x="150" y="0" width="140" height="34" rx="17" fill="#FFFFFF" stroke="rgba(124, 14, 68, 0.15)" />
    <text x="220" y="22" text-anchor="middle" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">CODE EXPORT</text>
  </g>
</svg>
