  <text x="212" y="260" fill="#7C0E44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">MINDLYTIC AI</text>
  <text x="212" y="278" fill="#4E3842" font-family="'Manrope', sans-serif" font-size="13">Dynamic attention affinity calculation with cached tensors:</text>

  <!-- Syntax Highlighted Code Box -->
  <rect x="170" y="296" width="432" height="196" rx="14" fill="#1A1116" stroke="rgba(124, 14, 68, 0.15)" stroke-width="1" />
  
  <!-- Code block header -->
  <rect x="170" y="296" width="432" height="28" rx="14" fill="#25161F" />
  <text x="188" y="315" fill="#D49A9A" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">useAttention.js</text>
  <text x="566" y="315" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">JS</text>

  <!-- Code content -->
  <text x="188" y="348" fill="#AA5E7A" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600">export function</text>
  <text x="312" y="348" fill="#FFFFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600">useAttention(tokens) {</text>

  <text x="206" y="374" fill="#AA5E7A" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600">const</text>
  <text x="252" y="374" fill="#FFFFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">scores =</text>
  <text x="320" y="374" fill="#D49A9A" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">matmul(Q, K.T)</text>
  <text x="444" y="374" fill="#FFFFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">/ Math.sqrt(d);</text>

  <text x="206" y="400" fill="#AA5E7A" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600">const</text>
  <text x="252" y="400" fill="#FFFFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">weights =</text>
  <text x="330" y="400" fill="#D49A9A" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">computed</text>
  <text x="402" y="400" fill="#FFFFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">(() =&gt; softmax(scores));</text>

  <text x="206" y="426" fill="#AA5E7A" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600">return</text>
  <text x="260" y="426" fill="#FFFFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">{ weights, context: matmul(weights.value, V) };</text>

  <text x="188" y="452" fill="#FFFFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">}</text>

