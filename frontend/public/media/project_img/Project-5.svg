  <text x="746" y="194" fill="#AA5E7A" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">INTELLIGENT LLM INTERFACE</text>

  <text x="674" y="232" fill="#4E3842" font-family="'Manrope', -apple-system, sans-serif" font-size="14" font-weight="500">Prompt-driven workspace with streaming AI chat,</text>
