  <g transform="translate(170, 246)">
    <rect width="32" height="32" rx="10" fill="#7C0E44" />
    <path d="M16 9C16 12 14 13.5 12 13.5C14 13.5 16 15 16 18C16 15 18 13.5 20 13.5C18 13.5 16 12 16 9Z" fill="#FFFFFF" />
